<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeAgent · 企业知识库问答</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<!-- 登录/注册视图 -->
<div id="auth-view" class="auth-view hidden">
    <div class="auth-card">
        <h1>KnowledgeAgent</h1>
        <p class="subtitle">企业知识库智能问答</p>
        <div class="auth-tabs">
            <button id="tab-login" class="tab active">登录</button>
            <button id="tab-register" class="tab">注册</button>
        </div>
        <form id="auth-form">
            <input type="text" id="auth-username" placeholder="用户名" autocomplete="username" required>
            <input type="password" id="auth-password" placeholder="密码" autocomplete="current-password" required>
            <input type="email" id="auth-email" placeholder="邮箱（注册选填）" class="hidden">
            <button type="submit" id="auth-submit" class="btn primary">登录</button>
        </form>
        <p id="auth-error" class="error hidden"></p>
    </div>
</div>

<!-- 主界面 -->
<div id="main-view" class="main-view hidden">
    <header class="topbar">
        <div class="brand">KnowledgeAgent</div>
        <div class="user-box">
            <button id="btn-admin" class="btn small hidden">管理后台</button>
            <span id="current-user"></span>
            <button id="btn-logout" class="btn small">退出</button>
        </div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="section-title">
                    <span>知识库</span>
                    <button id="btn-create-kb" class="btn small" title="新建知识库">＋</button>
                </div>
                <ul id="kb-list" class="list"></ul>
            </div>
            <div class="sidebar-section">
                <div class="section-title">
                    <span>对话</span>
                    <button id="btn-new-conversation" class="btn small" title="新建对话">＋</button>
                </div>
                <ul id="conversation-list" class="list"></ul>
            </div>
        </aside>
        <main class="chat-area">
            <div id="chat-header" class="chat-header">
                <span id="chat-title">请选择或创建对话</span>
                <button id="btn-toggle-docs" class="btn small">文档管理</button>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <form id="chat-form" class="chat-input-bar">
                <input type="text" id="chat-input" placeholder="输入问题，Enter 发送（支持多轮追问）" autocomplete="off">
                <button type="submit" id="btn-send" class="btn primary">发送</button>
            </form>
        </main>
        <aside id="docs-panel" class="docs-panel hidden">
            <div class="docs-header">
                <span>文档</span>
                <button id="btn-close-docs" class="btn small">×</button>
            </div>
            <div class="docs-upload">
                <input type="file" id="file-input" accept=".pdf,.docx,.doc,.txt,.md,.markdown,.xlsx,.pptx" multiple hidden>
                <button id="btn-upload" class="btn primary">上传文档（PDF/Word/TXT/MD/Excel/PPT ≤20MB，可多选）</button>
            </div>
            <ul id="doc-list" class="list"></ul>
        </aside>
    </div>
</div>

<!-- 管理后台 -->
<div id="admin-view" class="admin-view hidden">
    <div class="admin-card">
        <div class="admin-header">
            <span>管理后台</span>
            <button id="btn-close-admin" class="btn small">×</button>
        </div>
        <div class="admin-overview" id="admin-overview"></div>
        <h3 class="admin-section-title">近 7 天提问趋势</h3>
        <div class="trend-chart" id="ask-trend"></div>
        <h3 class="admin-section-title">问答反馈质量</h3>
        <div class="admin-overview" id="feedback-overview"></div>
        <div class="audit-table-wrap" style="margin-top:10px">
            <table class="audit-table" id="down-voted-table">
                <thead><tr><th>时间</th><th>问题</th><th>被点踩的回答</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <h3 class="admin-section-title">最近审计日志</h3>
        <div class="audit-table-wrap">
            <table class="audit-table" id="audit-table">
                <thead><tr><th>时间</th><th>用户</th><th>操作</th><th>对象</th><th>详情</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 成员管理 -->
<div id="member-modal" class="modal hidden">
    <div class="modal-card">
        <div class="modal-header">
            <span id="member-modal-title">成员管理</span>
            <button id="btn-close-member" class="btn small">×</button>
        </div>
        <div class="member-add">
            <input type="text" id="member-username" placeholder="用户名">
            <select id="member-role">
                <option value="VIEWER">可查看</option>
                <option value="EDITOR">可编辑</option>
            </select>
            <button id="btn-add-member" class="btn primary small">添加</button>
        </div>
        <ul id="member-list" class="list"></ul>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
